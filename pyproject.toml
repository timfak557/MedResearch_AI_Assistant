[project]
name = "medresearch-backend"
version = "0.1.0"
description = "MedResearch AI Assistant — evidence-grounded medical RAG backend over MedQuAD"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Depends() in argument defaults is the standard FastAPI idiom.
"app/api/routes/*" = ["B008"]
# The mojibake table intentionally contains odd unicode keys.
"app/data/cleaner.py" = ["RUF001"]
# Test ergonomics.
"tests/*" = ["RUF059", "B017"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require live services (Qdrant, network)",
]

[tool.setuptools.packages.find]
include = ["app*"]
